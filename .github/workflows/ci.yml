name: backend tests

# Runs the offline backend tests on every push and pull request. Nothing here touches NASA's archive or any AI provider:
# the tests use generated data, and the test setup blanks the AI settings. Tests marked "realdata" are opt-in and are not run.
on:
  push:
    branches: [main, back-end, deploy]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Test
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q -m "not realdata"
